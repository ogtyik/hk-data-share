name: update-universe-cache-hk

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 1 * *'

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Update HK universe cache and monthly exclusion files
        run: python scripts/update_symbol_universe.py

      - name: Commit and push if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/universe config/exclude_symbols.txt
          if git diff --cached --quiet; then
            echo 'No universe cache changes to commit.'
            exit 0
          fi
          git commit -m "chore: update monthly HK symbol universe and exclusions"
          git push
